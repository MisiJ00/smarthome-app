plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'dev.homeserver.devicekey'
version = '0.1.0'

android {
  namespace "dev.homeserver.devicekey"
  defaultConfig {
    versionCode 1
    versionName "0.1.0"
  }
  lintOptions {
    abortOnError false
  }
}

dependencies {
  // Fingerprint prompt bound to the key (CryptoObject)
  implementation 'androidx.biometric:biometric:1.1.0'
}
